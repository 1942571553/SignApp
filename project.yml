name: SignApp

packages:
  RorkSign:
    url: https://github.com/rorkai/rork-sign.git
    from: 0.6.5
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic

targets:
  SignApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SignApp
        excludes:
          - "Info.plist"
    settings:
      base:
        # 打包前由脚本替换：__BUNDLE_ID__ -> 你的 Bundle ID
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        PRODUCT_NAME: SignApp
        INFOPLIST_FILE: SignApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO


  SignLab:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SignLab
    dependencies:
      - package: RorkSign
        product: RorkSign
      - package: ZIPFoundation
        product: ZIPFoundation
    info:
      path: SignLab/Info.plist
      properties:
        CFBundleDisplayName: 签名工坊
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.signlab
        PRODUCT_NAME: SignLab
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  SignApp:
    build:
      targets:
        SignApp: all
    run:
      config: Debug
    archive:
      config: Release

  SignLab:
    build:
      targets:
        SignLab: all
    run:
      config: Debug
    archive:
      config: Release
