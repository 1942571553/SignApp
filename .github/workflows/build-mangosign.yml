name: Build MangoSign IPA

on:
  push:
    paths:
      - "MangoSign/**"
      - ".github/workflows/build-mangosign.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  env:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 记录环境
        run: |
          mkdir -p ci-logs
          {
            echo "date: $(date -u)"
            echo "runner: $RUNNER_OS $RUNNER_ARCH"
            echo "xcode-select: $(xcode-select -p || true)"
            xcodebuild -version || true
            echo "--- /Applications ---"
            ls /Applications | grep -i xcode || true
          } > ci-logs/mangosign-env.txt
      - name: 提交环境信息
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci-logs/mangosign-env.txt
          git commit -m "ci: mangosign env [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        id: xcode
        run: |
          if [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          fi
          xcodebuild -version
          swift --version

      - name: 编译（未签名）
        id: build
        working-directory: MangoSign
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project Feather.xcodeproj \
            -scheme Feather \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            > "$RUNNER_TEMP/build.log" 2>&1; then
            echo "=== 编译失败，最后 250 行 ==="
            tail -n 250 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          tail -n 30 "$RUNNER_TEMP/build.log"

      - name: 组装 ipa
        id: package
        working-directory: MangoSign
        run: |
          APP=$(find . -path '*_build/Applications/Feather.app' -print -quit)
          if [ -z "$APP" ]; then
            APP=$(find "$RUNNER_TEMP/dd" -name 'Feather.app' -path '*Release-iphoneos*' -print -quit)
          fi
          if [ -z "$APP" ]; then
            echo "找不到 Feather.app"
            exit 1
          fi
          echo "APP=$APP"
          rm -rf out MangoSign-unsigned.ipa
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/Feather.app
          chmod -R 0755 out/Payload/Feather.app
          cd out
          /usr/bin/zip -qry ../MangoSign-unsigned.ipa Payload
          cd ..
          ls -lh MangoSign-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "out/Payload/Feather.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "out/Payload/Feather.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "out/Payload/Feather.app/Info.plist"

      - name: 上传 ipa
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: MangoSign-unsigned
          path: MangoSign/MangoSign-unsigned.ipa

      - name: 发布 Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mangosign-${{ github.run_number }}
          name: MangoSign build ${{ github.run_number }}
          files: MangoSign/MangoSign-unsigned.ipa
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 失败诊断
        if: failure()
        run: |
          mkdir -p ci-logs
          {
            echo "xcode=${{ steps.xcode.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "package=${{ steps.package.outcome }}"
            echo "upload=${{ steps.upload.outcome }}"
            echo "release=${{ steps.release.outcome }}"
            echo "--- build.log tail ---"
            tail -n 400 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "no build.log"
          } > ci-logs/mangosign-build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci-logs/mangosign-build.log
          git commit -m "ci: mangosign log [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
