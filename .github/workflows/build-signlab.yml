name: Build SignLab IPA

on:
  push:
    paths:
      - "SignLab/**"
      - ".github/workflows/build-signlab.yml"
      - "project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 编译（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project SignApp.xcodeproj \
            -scheme SignLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | tail -80

      - name: 打包 ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SignLab.app Payload/
          zip -qr SignLab-unsigned.ipa Payload
          ls -lh SignLab-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SignLab-unsigned
          path: SignLab-unsigned.ipa
          if-no-files-found: error

      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signlab-${{ github.run_number }}
          name: SignLab build ${{ github.run_number }}
          files: SignLab-unsigned.ipa

      - name: 记录成功
        if: success()
        run: |
          mkdir -p ci-logs
          echo "ok run=${{ github.run_number }} at $(date -u +%FT%TZ)" > ci-logs/signlab-status.txt
          git config user.name "signlab-ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci-logs/signlab-status.txt
          git commit -m "ci: signlab build ok #${{ github.run_number }}" || true
          git push || true

      - name: 记录失败日志
        if: failure()
        run: |
          mkdir -p ci-logs
          { echo "failed run=${{ github.run_number }}"; echo; tail -400 build.log 2>/dev/null || true; } > ci-logs/signlab-build.log
          git config user.name "signlab-ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci-logs/signlab-build.log
          git commit -m "ci: signlab build failed #${{ github.run_number }}" || true
          git push || true
