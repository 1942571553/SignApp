name: Build IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID（留空则用仓库变量 BUNDLE_ID）"
        required: false
        default: ""
      export_method:
        description: "导出方式：ad-hoc / development / app-store"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 写入品牌与 Bundle ID
        env:
          INPUT_BUNDLE_ID: ${{ inputs.bundle_id }}
          VAR_BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          APP_NAME: ${{ vars.APP_NAME || '签名助手' }}
          DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL }}
        run: |
          set -euo pipefail
          BUNDLE_ID="${INPUT_BUNDLE_ID:-${VAR_BUNDLE_ID:-com.example.signapp}}"
          echo "BUNDLE_ID=${BUNDLE_ID}" >> "$GITHUB_ENV"
          sed -i '' "s|__BUNDLE_ID__|${BUNDLE_ID}|g" project.yml
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${APP_NAME}" SignApp/Info.plist
          if [ -n "${DEFAULT_SERVER_URL:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :DefaultServerURL ${DEFAULT_SERVER_URL}" SignApp/Info.plist
          fi

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 检查签名密钥
        id: keys
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -n "${ASC_KEY_ID:-}" ]; then
            echo "mode=asc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: 导入 App Store Connect API Key
        if: steps.keys.outputs.mode == 'asc'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "${ASC_KEY_P8}" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: 带签名打包（开发者账号）
        if: steps.keys.outputs.mode == 'asc'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method || vars.EXPORT_METHOD || 'ad-hoc' }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project SignApp.xcodeproj \
            -scheme SignApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/SignApp.xcarchive" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

          cat > "$PWD/build/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/SignApp.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: 未签名打包（无证书时）
        if: steps.keys.outputs.mode == 'none'
        run: |
          set -euo pipefail
          xcodebuild -project SignApp.xcodeproj \
            -scheme SignApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
          mkdir -p "$PWD/build/Payload"
          cp -R "$PWD/build/dd/Build/Products/Release-iphoneos/SignApp.app" "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -qry "SignApp-unsigned.ipa" Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SignApp-${{ github.run_number }}
          path: |
            build/export/*.ipa
            build/*.ipa
          if-no-files-found: error
          retention-days: 30
